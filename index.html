 gente."]],[["El Lobo Ferreyra","Pibe... eu estava naquela corrida. Vi tudo. Não foi acidente."],["Gui","Então me ajuda a provar."],["El Lobo Ferreyra","Vence o Chile. A Víbora tem a gravação."],["Zeca","E Gui... terminei de restaurar o carro do seu pai. O Relâmpago 7 está na garagem esperando por você."]],[["La Víbora Soto","Toma. A câmera do meu carro gravou tudo. O Draven bateu de propósito."],["Gui","Obrigado. Agora falta derrotar ele na pista."]],[["Inti Quispe","Os Andes respeitam quem corre limpo. Vá para o mundo, Rocha."],["Zeca","O mundo inteiro está olhando para você agora."]],[["Narrador","Gui cruzou a linha de chegada à frente do Devil Sixten 666, no mesmo penhasco onde tudo começou."],["Narrador","Com a gravação da Víbora, os comissários reabriram o caso. Viktor Draven foi banido das pistas para sempre."],["Zeca","Seu pai estaria orgulhoso, Gui."],["Gui","Esse troféu é dele."],["Narrador","FIM. O Devil Sixten 666 agora está na sua garagem. Continue correndo pelo mundo e subindo no Ranking Mundial."]]],bossLose:['Marreta Silva: "Eu avisei, moleque."','El Lobo Ferreyra: "Ainda não, pibe. Ainda não."','La Víbora Soto: "O deserto engole os fracos."','Inti Quispe: "Os Andes não perdoam."','Viktor Draven: "Igualzinho ao pai."']},m=["Rafa Turbo","Bia Nitro","Max Diesel","Léo Drift","Kaio Faísca","Duda Veloz","Nina Pistão","Theo Rally","Gabi Torque"],p=["rio","sul","mendoza","atacama","tokyo"],v=[{id:"eggs",n:"Ovos dourados",hint:"Há 5 ovos dourados escondidos no ar, em algumas cidades da Turnê.",reward:"Carro Bolinha Turbo"},{id:"konami",n:"Código clássico",hint:"Um código antigo de videogame, digitado no menu principal...",reward:"Carro Van Foguete"},{id:"beto",n:"Mensagem no rádio",hint:"Escreva o nome do pai do Gui na tela do mapa.",reward:"Pintura Relâmpago Dourado"},{id:"flips",n:"Acrobata",hint:"Dê 5 mortais numa única corrida.",reward:"Adesivo Estrelas + Neon Roxo"}];u.beto=[["Beto","Filho... se você está ouvindo isso, achou a mensagem que eu deixei gra <style>#hrc{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:rgba(5,8,14,.72);backdrop-filter:blur(3px);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;padding:12px}
#hrc.hrc-hidden{display:none}
.hrc-box{width:min(720px,100%);max-height:calc(100vh - 24px);overflow:auto;background:#111823;border:1px solid #2a3647;border-radius:14px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6);user-select:text}
.hrc-box.narrow{width:min(440px,100%)}
.hrc-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.hrc-h h2{font-style:italic;font-weight:900;color:#ffb703;font-size:24px;letter-spacing:.5px}
.hrc-x{background:#1c2533;border:1px solid #2a3647;color:#cfd8e3;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:700}
.hrc-sub{color:#8fa1b8;font-size:13px;margin:-6px 0 12px}
.hrc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.hrc-tab{background:#1c2533;border:1px solid #2a3647;color:#cfd8e3;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.hrc-tab.on{background:#ffb703;border-color:#ffb703;color:#111}
.hrc-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hrc select,.hrc input{background:#0b1018;border:1px solid #2a3647;color:#fff;border-radius:8px;padding:9px 10px;font-size:15px;font-family:inherit;width:100%}
.hrc select{width:auto;min-width:180px}
.hrc label{display:block;font-size:12px;color:#8fa1b8;margin:10px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.hrc-btn{display:inline-block;background:linear-gradient(90deg,#ffd60a,#ff9500);color:#111;font-weight:900;font-style:italic;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-size:15px;text-align:center}
.hrc-btn.full{width:100%;margin-top:14px}
.hrc-btn.ghost{background:#1c2533;color:#cfd8e3;border:1px solid #2a3647;font-style:normal;font-weight:700}
.hrc-btn.danger{background:#3a1218;color:#ff8fa3;border:1px solid #6b1f2c;font-style:normal;font-weight:700}
.hrc-btn[disabled]{opacity:.5;pointer-events:none}
.hrc-link{background:none;border:0;color:#4cc9f0;cursor:pointer;font-size:13px;padding:6px 0;text-decoration:underline}
.hrc-msg{margin-top:10px;font-size:13px;padding:9px 11px;border-radius:8px;background:#1c2533;color:#cfd8e3}
.hrc-msg.err{background:#3a1218;color:#ffb3c1}

<script>window.HRC_CONFIG={"apiKey": "AIzaSyCzdry_lil1wEYKZycCAP3tbAD8-iBWi8U", "authDomain": "hill-racer-gt-19b0f.firebaseapp.com", "projectId": "hill-racer-gt-19b0f", "storageBucket": "hill-racer-gt-19b0f.firebasestorage.app", "messagingSenderId": "345057636231", "appId": "1:345057636231:web:bfe3b5350481a206aded22", "validator": "https://southamerica-east1-hill-racer-gt-19b0f.cloudfunctions.net/validatePurchase"};</script>
<script type="module">
// ===== Hill Racer GT · Conta, save na nuvem e ranking (Firebase) =====
const FB = "13.1.0";
const CFG = window.HRC_CONFIG || {};
const T = window.HRC_TEST || null;               // só usado nos testes locais
const ON = !!(CFG.apiKey && CFG.apiKey !== "COLE_AQUI" && CFG.projectId);
const root = document.getElementById("hrc");
const LS = { get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }, set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }, del(k){ try{ localStorage.removeItem(k) }catch(e){} } };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const G = () => window.__HR;
const fmtT = v => v == null ? "—" : v.toFixed(2) + " s";
const fmtN = v => v == null ? "—" : Math.round(v).toLocaleString("pt-BR");
const NICK_RE = /^[A-Za-z0-9_]{3,16}$/;
const SAVE_EVERY = 20e3;

let A = null, F = null, auth = null, db = null;  // módulos e instâncias
let user = null, profile = null, ready = false, loadErr = "";
let view = null, unsub = null, busy = false;
let lastSaveUp = 0, saveDirty = false, syncNote = "";
const backoff = {};

const ERR = {
  "auth/email-already-in-use": "Este e-mail já tem conta. Use \"Entrar\".",
  "auth/invalid-email": "E-mail inválido.",
  "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
  "auth/invalid-credential": "E-mail ou senha incorretos.",
  "auth/wrong-password": "E-mail ou senha incorretos.",
  "auth/user-not-found": "E-mail ou senha incorretos.",
  "auth/too-many-requests": "Muitas tentativas. Espere alguns minutos e tente de novo.",
  "auth/network-request-failed": "Sem conexão com a internet.",
  "auth/requires-recent-login": "Por segurança, digite sua senha de novo.",
  "auth/unauthorized-domain": "Este site não está autorizado no Firebase (Authentication › Settings › Authorized domains).",
  "permission-denied": "O servidor recusou o envio.",
  "unavailable": "Servidor indisponível. Tente de novo em instantes."
};
const errMsg = e => ERR[e && e.code] || (e && e.message) || "Erro desconhecido.";

// ---------- carregamento do Firebase ----------
async function boot() {
  if (!ON) { ready = true; return; }
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB}/`;
    const [appM, authM, fsM] = await Promise.all([
      import(base + "firebase-app.js"), import(base + "firebase-auth.js"),
      import(T && T.firestoreUrl ? T.firestoreUrl : base + "firebase-firestore.js")]);
    A = authM; F = fsM;
    const app = appM.initializeApp(CFG);
    auth = A.getAuth(app); auth.languageCode = "pt-BR";
    if (T && T.authEmulator) A.connectAuthEmulator(auth, T.authEmulator, { disableWarnings: true });
    db = F.getFirestore(app);
    A.onAuthStateChanged(auth, onUser);
  } catch (e) { loadErr = "Não foi possível carregar o módulo online. Verifique sua internet."; ready = true; render(); }
}

async function onUser(u) {
  user = u; profile = null; ready = true;
  if (u) {
    try { const s = await F.getDoc(F.doc(db, "players", u.uid)); profile = s.exists() ? s.data() : null; } catch (e) {}
    if (profile && profile.nick) {
      const P = G() && G().P; if (P) P.name = profile.nick;
      LS.set("hrc.nick", profile.nick);
      await linkSave();
      syncRecords();
      claimRewards();
    }
  } else {
    const P = G() && G().P; if (P && P.name === LS.get("hrc.nick")) P.name = "Gui";
    LS.del("hrc.nick");
  }
  decorateHub(); render();
}

// ---------- save na nuvem ----------
const localJSON = () => { const g = G(); return g ? JSON.stringify(g.snap().P) : null; };
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h); };

async function linkSave() {
  const g = G(); if (!g || !user) return;
  const linked = LS.get("hrc.linked"), cur = localJSON();
  let cloud = null;
  try { const s = await F.getDoc(F.doc(db, "saves", user.uid)); cloud = s.exists() ? s.data() : null; } catch (e) { syncNote = "Não deu para ler o save da nuvem."; return; }
  if (cloud && !econ2(cloud.data)) cloud = null;   // save da fase de testes: recomeça do zero
  if (!cloud) { await uploadSave(true); LS.set("hrc.linked", user.uid); return; }
  const sameAcc = linked === user.uid;
  const localChanged = hash(cur) !== LS.get("hrc.hash");
  const cloudNewer = cloud.t > Number(LS.get("hrc.cloudT") || 0);
  if (sameAcc && !cloudNewer) { if (localChanged) await uploadSave(true); return; }
  if (sameAcc && cloudNewer && !localChanged) { applyCloud(cloud); return; }
  if (hash(cloud.data) === hash(cur)) { LS.set("hrc.linked", user.uid); LS.set("hrc.cloudT", String(cloud.t)); LS.set("hrc.hash", hash(cur)); return; }
  view = { k: "conflict", cloud }; open();   // pergunta qual progresso manter
}

function econ2(data) { try { return JSON.parse(data).econ === 2; } catch (e) { return false; } }
function summary(P) {
  const cars = Array.isArray(P.cars) ? P.cars.length : (P.cars && P.cars.size) || 0;
  return `<b>${fmtN(P.trophies || 0)}</b> troféus · <b>${cars}</b> carros<br>$ ${fmtN(P.money || 0)} · ${P.wins || 0} vitórias`;
}
function applyCloud(cloud) {
  try {
    const P = JSON.parse(cloud.data);
    if (profile) P.name = profile.nick;
    G().load(P);
    LS.set("hrc.linked", user.uid); LS.set("hrc.cloudT", String(cloud.t)); LS.set("hrc.hash", hash(localJSON()));
    syncNote = "Progresso da nuvem carregado.";
  } catch (e) { syncNote = "O save da nuvem está corrompido."; }
}
async function uploadSave(force) {
  if (!user || !db || !G()) return;
  const cur = localJSON(); if (!cur) return;
  const h = hash(cur);
  if (!force && h === LS.get("hrc.hash")) { saveDirty = false; return; }
  const t = Date.now();
  try {
    await F.setDoc(F.doc(db, "saves", user.uid), { data: cur, t, ts: F.serverTimestamp() });
    LS.set("hrc.linked", user.uid); LS.set("hrc.cloudT", String(t)); LS.set("hrc.hash", h);
    lastSaveUp = Date.now(); saveDirty = false;
    syncNote = "Salvo na nuvem às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { syncNote = "Falha ao salvar na nuvem: " + errMsg(e); }
}

// ---------- ranking mensal ----------
const monthKey = (d = new Date()) => String(d.getUTCFullYear() * 100 + d.getUTCMonth() + 1);
const prevMonthKey = () => { const d = new Date(); return monthKey(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - 1, 1))); };
const monthName = k => { const m = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"][Number(k.slice(4)) - 1]; return m + " de " + k.slice(0, 4); };
const PRIZES = "Prêmio de 500 💎 dividido entre o top 100 no dia 1º: 1º 70 · 2º 35 · 3º 25 · 4º–10º 10 · 11º–30º 5 · 31º–60º 4 · 61º–100º 2. O 1º lugar vira Campeão Mundial do mês.";
const prizeFor = p => p === 1 ? 70 : p === 2 ? 35 : p === 3 ? 25 : p <= 10 ? 10 : p <= 30 ? 5 : p <= 60 ? 4 : p <= 100 ? 2 : 0;
function monthPts() {
  const P = G().P, k = monthKey();
  if (!P.mon || P.mon.k !== k) P.mon = { k, base: P.trophies || 0 };
  return Math.max(0, (P.trophies || 0) - P.mon.base);
}
async function claimRewards() {
  if (!user || !profile || !G()) return;
  const ref = F.doc(db, "rewards", `${user.uid}_${prevMonthKey()}`);
  try {
    const s = await F.getDoc(ref); if (!s.exists()) return;
    const r = s.data(); if (r.claimed) return;
    await F.setDoc(ref, { claimed: true }, { merge: true });   // marca antes de dar, para não ganhar duas vezes
    const P = G().P; P.gems = (P.gems || 0) + (r.gems || 0); G().save(); G().refresh();
    view = { k: "account", noFocus: true, m: `🏆 Você terminou o ranking mensal de ${monthName(r.month || prevMonthKey())} em ${r.pos}º lugar e ganhou ${r.gems} 💎!`, mc: "ok" }; open();
  } catch (e) {}
}

// ---------- recordes ----------
function bests() {
  const g = G(), P = g.P, out = [];
  let all = null;
  for (const [car, r] of Object.entries(P.td || {})) {
    if (r && typeof r.t1900 === "number") {
      out.push({ key: "td:" + car, path: ["td", car, "runs"], data: { car, t1900: r.t1900, vmax: r.vmax || 0 }, val: r.t1900, low: true });
      if (!all || r.t1900 < all.t1900) all = { car, t1900: r.t1900, vmax: r.vmax || 0 };
    }
  }
  if (all) out.push({ key: "tdall", path: ["tdall"], data: all, val: all.t1900, low: true });
  for (const [env, d] of Object.entries(P.advBest || {}))
    if (d > 0) out.push({ key: "adv:" + env, path: ["adv", env, "runs"], data: { car: "", env, dist: d }, val: d });
  const wk = g.week();
  for (const ev of g.events()) {
    if (ev.type === "race") continue;
    const b = P.ev && P.ev[wk + ":" + ev.id] && P.ev[wk + ":" + ev.id].best;
    if (b > 0) out.push({ key: `ev:${wk}_${ev.id}`, path: ["ev", `${wk}_${ev.id}`, "runs"], data: { car: "", val: b }, val: b });
  }
  const mk = monthKey(), mp = monthPts();
  if (mp > 0) out.push({ key: "mon:" + mk, path: ["month", mk, "runs"], data: { car: "", pts: mp }, val: mp, any: true });
  return out;
}
let syncing = false;
async function syncRecords() {
  if (!user || !profile || !user.emailVerified || syncing || !G()) return;
  syncing = true;
  try {
    const ck = "hrc.up2." + user.uid, up = JSON.parse(LS.get(ck) || "{}"), now = Date.now();
    for (const b of bests()) {
      const old = up[b.key];
      if (old != null && (b.any ? b.val === old : b.low ? b.val >= old : b.val <= old)) continue;
      if (backoff[b.key] && backoff[b.key].until > now) continue;
      if (b.any) { b.val = Math.min(b.val, (old || 0) + 200); b.data.pts = b.val; }   // o servidor aceita no máximo +200 por envio
      try {
        await F.setDoc(F.doc(db, ...b.path, user.uid), { ...b.data, uid: user.uid, nick: profile.nick, ts: F.serverTimestamp() });
        up[b.key] = b.val; delete backoff[b.key];
      } catch (e) {
        const n = (backoff[b.key] ? backoff[b.key].n : 0) + 1;
        backoff[b.key] = { n, until: now + 30e3 * n };
        if (n >= 3) up[b.key] = b.val;         // o servidor já tem um valor melhor ou recusou; para de insistir
      }
    }
    const P = G().P;
    const st = P.stats || {}, tdv = Object.entries(P.td || {}).filter(([, r]) => r && typeof r.t1900 === "number").sort((a, b) => a[1].t1900 - b[1].t1900)[0];
    const adv = Object.entries(P.advBest || {}).sort((a, b) => b[1] - a[1])[0];
    const envN = adv ? ((G().envs().find(x => x.id === adv[0]) || {}).n || adv[0]) : "";
    const pl = { trophies: P.trophies || 0, wins: P.wins || 0, car: P.car, races: st.races || 0, topSpeed: Math.round(st.top || 0), topCar: st.topCar || "",
      tdBest: tdv ? tdv[1].t1900 : 0, tdCar: tdv ? tdv[0] : "", advBest: adv ? Math.floor(adv[1]) : 0, advEnv: adv ? adv[0] : "", advEnvName: envN, league: leagueOf(P.trophies || 0) };
    const pk = JSON.stringify(pl);
    if (up._pl !== pk && !(backoff._pl && backoff._pl.until > now)) {
      try { await F.setDoc(F.doc(db, "players", user.uid), { ...pl, nick: profile.nick, ts: F.serverTimestamp() }, { merge: true }); up._pl = pk; delete backoff._pl; }
      catch (e) { backoff._pl = { n: 1, until: now + 60e3 }; }
    }
    LS.set(ck, JSON.stringify(up));
  } finally { syncing = false; }
}

// ---------- estatísticas e ligas ----------
function onRace(e) {
  const g = G(); if (!g || !e) return;
  const P = g.P; P.stats = P.stats || { races: 0, top: 0, topCar: "" };
  P.stats.races++;
  if ((e.speed || 0) > (P.stats.top || 0)) { P.stats.top = e.speed; P.stats.topCar = P.car; }
}
function league() {
  const g = G(); if (!g) return;
  const P = g.P, now = leagueOf(P.trophies || 0);
  if (P.leagueMax == null) P.leagueMax = 0;
  if (now <= P.leagueMax) return;
  const msgs = [];
  for (let l = P.leagueMax + 1; l <= now; l++) {
    P.gems = (P.gems || 0) + LEAGUE_GEMS[l];
    msgs.push(`⬆ Liga ${LEAGUES[l].n}! +${LEAGUE_GEMS[l]} 💎`);
    if (l === 5 && g.unlock("sky")) msgs.push("🏆 Carro lendário liberado: <b>Sky</b>!");
  }
  P.leagueMax = now;
  msgs.forEach(m => g.toast(m.replace(/<[^>]+>/g, "")));
  g.note(msgs.join(" · "));
}

// chamado pelo jogo a cada save local (a cada 8 s fora de corrida, ao sair da aba e após resultados)
window.HRC = {
  onRace, league,
  onSave() {
    try { league(); } catch (e) {}
    if (!user || !profile) return;
    saveDirty = true;
    const hidden = document.hidden;
    if (hidden || Date.now() - lastSaveUp > SAVE_EVERY) uploadSave(false);
    syncRecords();
  },
  open: (k) => { view = { k: k || "account" }; open(); }
};

// valida a compra do Google Play no servidor antes de liberar o item
window.HRC.validate = async (body, cb) => {
  try {
    const headers = { "content-type": "application/json" };
    if (user) { try { headers.authorization = "Bearer " + await user.getIdToken(); } catch (e) {} }
    const r = await fetch(CFG.validator, { method: "POST", headers, body: JSON.stringify(body) });
    cb(await r.json());
  } catch (e) { cb({ ok: false, code: 6778003, message: "Sem conexão com o validador" }); }
};

// instalar no PC/celular pelo navegador (PWA)
let installEvt = null;
const IS_APP = !!window.HR_APP || /HillRacerDesktop/.test(navigator.userAgent);
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; decorateHub(); });
addEventListener("appinstalled", () => { installEvt = null; decorateHub(); });

// ---------- conta ----------
async function signUp(email, pass, nick) {
  if (!NICK_RE.test(nick)) throw { message: "Apelido: 3 a 16 letras, números ou _ (sem espaço e sem acento)." };
  const nref = F.doc(db, "nicks", nick.toLowerCase());
  const pre = await F.getDoc(nref);
  if (pre.exists()) throw { message: "Esse apelido já está em uso. Escolha outro." };
  const cred = await A.createUserWithEmailAndPassword(auth, email, pass);
  await claimNick(cred.user, nick);
  try { await A.sendEmailVerification(cred.user); } catch (e) {}
}
async function claimNick(u, nick) {
  const nref = F.doc(db, "nicks", nick.toLowerCase()), pref = F.doc(db, "players", u.uid);
  const P = G().P;
  await F.runTransaction(db, async tx => {
    const n = await tx.get(nref);
    if (n.exists()) throw { message: "Esse apelido acabou de ser escolhido por outra pessoa. Tente outro." };
    tx.set(pref, { nick, trophies: 0, wins: 0, car: P.car, ts: F.serverTimestamp() });
    tx.set(nref, { uid: u.uid });
  });
  profile = { nick }; P.name = nick; LS.set("hrc.nick", nick);
  await linkSave();
  decorateHub();
}
async function deleteAccount(pass) {
  const u = user, uid = u.uid, g = G(), P = g.P;
  await A.reauthenticateWithCredential(u, A.EmailAuthProvider.credential(u.email, pass));
  const refs = [F.doc(db, "saves", uid), F.doc(db, "players", uid), F.doc(db, "tdall", uid)];
  if (profile && profile.nick) refs.push(F.doc(db, "nicks", profile.nick.toLowerCase()));
  g.cars().forEach(c => refs.push(F.doc(db, "td", c.id, "runs", uid)));
  g.envs().forEach(e => refs.push(F.doc(db, "adv", e.id, "runs", uid)));
  if (P.mon && P.mon.k) refs.push(F.doc(db, "month", P.mon.k, "runs", uid));
  Object.keys(P.ev || {}).forEach(k => { const [w, id] = k.split(":"); refs.push(F.doc(db, "ev", `${w}_${id}`, "runs", uid)); });
  for (let i = 0; i < refs.length; i += 400) {
    const b = F.writeBatch(db); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit();
  }
  ["hrc.linked", "hrc.cloudT", "hrc.hash", "hrc.up." + uid, "hrc.up2." + uid].forEach(LS.del);
  await A.deleteUser(u);
}

// ---------- interface ----------
function open() { root.classList.remove("hrc-hidden"); root.classList.add("hrc"); render(); }
function close() {
  if (view && view.k === "conflict") return;      // precisa escolher
  root.classList.add("hrc-hidden"); stopLive(); view = null; decorateHub(); G() && G().refresh();
}
function stopLive() { if (unsub) { try { unsub(); } catch (e) {} unsub = null; } }
const head = (t, sub, x = true) => `<div class="hrc-h"><h2>${t}</h2>${x ? '<button class="hrc-x" data-a="close">✕ Fechar</button>' : ""}</div>${sub ? `<div class="hrc-sub">${sub}</div>` : ""}`;
const msg = (m, cls = "") => m ? `<div class="hrc-msg ${cls}">${m}</div>` : "";

function render() {
  if (!view || root.classList.contains("hrc-hidden")) return;
  if (view.k === "rank") return renderRank();
  if (view.k === "profile") return renderProfile();
  if (view.k === "privacy") return renderPrivacy();
  if (view.k === "conflict") return renderConflict();
  renderAccount();
}

function renderAccount() {
  const v = view;
  let h;
  if (!ON) h = head("CONTA 👤") + msg("O modo online ainda não foi configurado neste jogo (falta a configuração do Firebase).", "warn");
  else if (loadErr) h = head("CONTA 👤") + msg(loadErr, "err");
  else if (!ready) h = head("CONTA 👤") + `<div class="hrc-empty">Carregando…</div>`;
  else if (!user) {
    const tab = v.tab || "login";
    h = head("CONTA 👤", "Crie uma conta para salvar seu progresso na nuvem e aparecer no ranking. Você pode continuar jogando sem conta.") +
      `<div class="hrc-tabs"><button class="hrc-tab ${tab === "login" ? "on" : ""}" data-a="tab" data-v="login">Entrar</button><button class="hrc-tab ${tab === "new" ? "on" : ""}" data-a="tab" data-v="new">Criar conta</button></div>` +
      (tab === "reset"

async function myPos(b, col, rows, myId) {
  const el = document.getElementById("hrc-me"); if (!el) return;
  if (!user) { el.innerHTML = `<span>Entre com sua conta para aparecer no ranking.</span><button class="hrc-link" data-a="account">Entrar / criar conta</button>`; return; }
  if (!user.emailVerified) { el.innerHTML = `<span>Confirme seu e-mail para seus recordes entrarem no ranking.</span><button class="hrc-link" data-a="account">Ver conta</button>`; return; }
  const i = rows.findIndex(r => r.id === myId);
  if (i >= 0) { el.innerHTML = `<span>Sua posição: <b>${i + 1}º</b></span>`; return; }
  try {
    const me = await F.getDoc(F.doc(col, myId));
    if (!me.exists()) { el.innerHTML = "<span>Você ainda não tem recorde aqui.</span>"; return; }
    const c = await F.getCountFromServer(F.query(col, F.where(b.field, b.dir === "asc" ? "<" : ">", me.data()[b.field])));
    el.innerHTML = `<span>Sua posição: <b>${c.data().count + 1}º</b> · ${b.fmt(me.data()[b.field])}</span>`;
  } catch (e) { el.innerHTML = ""; }
}

// ---------- eventos da interface ----------
const val = id => (root.querySelector("#" + id) || {}).value || "";
async function act(a, el) {
  const v = view;
  const run = async (fn, okMsg) => {
    if (busy) return; busy = true;
    root.querySelectorAll("button").forEach(b => b.disabled = true);
    try { await fn(); if (okMsg) { v.m = okMsg; v.mc = "ok"; } }
    catch (e) { v.m = errMsg(e); v.mc = "err"; }
    busy = false; render();
  };
  switch (a) {
    case "close": return close();
    case "back": view = { k: "account" }; return render();
    case "account": stopLive(); view = { k: "account" }; return render();
    case "rank": stopLive(); view = { k: "rank", b: (v && v.lastB) || undefined }; return render();
    case "profile": stopLive(); view = { k: "profile", uid: el.dataset.v || (user && user.uid), lastB: v && (v.b || v.lastB) }; return render();
    case "privacy": view = { k: "privacy", from: v && v.k }; return render();
    case "tab": view = { k: "account", tab: el.dataset.v, email: val("hrc-em") }; return render();
    case "board": v.b = el.dataset.v; v.o = null; return render();
    case "login": v.email = val("hrc-em"); return run(() => A.signInWithEmailAndPassword(auth, v.email.trim(), val("hrc-pw")));
    case "signup": v.email = val("hrc-em"); v.nick = val("hrc-nk").trim();
      return run(() => signUp(v.email.trim(), val("hrc-pw"), v.nick), "Conta criada! Confirme seu e-mail pelo link que enviamos.");
    case "nick": v.nick = val("hrc-nk").trim();
      return run(async () => {
        if (!NICK_RE.test(v.nick)) throw { message: "Apelido: 3 a 16 letras, números ou _ (sem espaço e sem acento)." };
        await claimNick(user, v.nick); syncRecords();
      });
    case "reset": v.email = val("hrc-em"); return run(() => A.sendPasswordResetEmail(auth, v.email.trim()).catch(e => { if (e.code !== "auth/user-not-found") throw e; }), "Se esse e-mail tiver conta, enviamos um link para criar uma nova senha.");
    case "verify-send": return run(() => A.sendEmailVerification(user), "E-mail de confirmação reenviado.");
    case "verify-check": return run(async () => {
      await A.reload(user); await user.getIdToken(true);
      if (!user.emailVerified) throw { message: "Ainda não confirmado. Clique no link do e-mail e tente de novo." };
      syncRecords();
    }, "E-mail confirmado! Seus recordes já estão indo para o ranking.");
    case "sync": return run(async () => { await uploadSave(true); await syncRecords(); }, null);
    case "logout": return run(async () => { await uploadSave(false); await A.signOut(auth); view = { k: "account" }; }, null);
    case "del": v.del = true; v.m = ""; return render();
    case "del-cancel": v.del = false; return render();
    case "del-go": return run(async () => { await deleteAccount(val("hrc-pw")); view = { k: "account", m: "Sua conta e seus dados online foram excluídos.", mc: "ok" }; });
    case "use-cloud": applyCloud(v.cloud); view = { k: "account", noFocus: true }; return render();
    case "use-local": view = { k: "account", noFocus: true }; await uploadSave(true); return render();
  }
}
root.addEventListener("click", e => {
  if (e.target === root) return close();
  const el = e.target.closest("[data-a]"); if (!el || el.tagName === "FORM") return;
  e.preventDefault(); act(el.dataset.a, el);
});
root.addEventListener("submit", e => { e.preventDefault(); act(e.target.dataset.a, e.target); });
root.addEventListener("change", e => { if (e.target.id === "hrc-opt") { view.o = e.target.value; render(); } });
// o teclado não vaza para o jogo enquanto a janela está aberta
addEventListener("keydown", e => {

function decorateHub() {
  const hub = document.querySelector("#ui .hub"); if (!hub) return;
  const top = hub.querySelector(".htop"); if (!top) return;
  let bar = top.querySelector(".hrc-bar");
  if (!bar) {
    bar = document.createElement("div"); bar.className = "hrc-bar";
    bar.innerHTML = '<button data-hrc="account"></button><button data-hrc="rank">🏆 Ranking</button>';
    bar.addEventListener("click", ev => { const b = ev.target.closest("[data-hrc]"); if (!b || b.dataset.hrc === "install" || b.dataset.hrc === "play") return; ev.stopPropagation(); view = { k: b.dataset.hrc }; open(); });
    const logo = top.querySelector(".hlogo"); logo ? top.insertBefore(bar, logo) : top.appendChild(bar);
  }
  let ins = bar.querySelector('[data-hrc="install"]');
  if (installEvt && !IS_APP && !ins) {
    ins = document.createElement("button"); ins.dataset.hrc = "install"; ins.textContent = "⬇ Instalar";
    ins.addEventListener("click", async ev => { ev.stopPropagation(); const e = installEvt; if (!e) return; e.prompt(); try { await e.userChoice; } catch (x) {} installEvt = null; decorateHub(); });
    bar.prepend(ins);
  } else if (!installEvt && ins) ins.remove();
  if (CFG.playUrl && !IS_APP && !bar.querySelector('[data-hrc="play"]')) {
    const pl = document.createElement("a"); pl.dataset.hrc = "play"; pl.href = CFG.playUrl; pl.target = "_blank"; pl.rel = "noopener"; pl.textContent = "▶ Google Play";
    pl.addEventListener("click", ev => ev.stopPropagation()); bar.prepend(pl);
  }
  const acc = bar.querySelector('[data-hrc="account"]');
  const on = user && profile && profile.nick;
  acc.className = on ? "on" : "";
  acc.textContent = on ? "☁️ " + profile.nick : "👤 Entrar";
}

// App Android: o jogo vem dentro do app; avisa que há versão nova na Play Store.
const SITE = "https://hill-racer-gt.vercel.app";
const PLAY_URL = "https://play.google.com/store/apps/details?id=br.com.hillracergt.game";
let updPending = false, updWarned = LS.get("hrc.updWarned");
async function checkUpdate() {
  if (!window.HR_BUILD || document.hidden) return;
  const remote = /^https?:$/.test(location.protocol) && !window.HR_APP ? "" : SITE;
  if (location.protocol === "file:" && !remote) return;
  let build = null;
  try { const r = await fetch(remote + "/version.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) build = (await r.json()).build; } catch (e) { return; }
  if (!build || build <= window.HR_BUILD) return;
  if (window.HR_APP) {
    if (updWarned === build) return;
    updWarned = build; LS.set("hrc.updWarned", build);
    G() && G().note(`🔄 Versão nova do jogo disponível. <a href="${PLAY_URL}" target="_blank" style="color:#4cc9f0">Atualizar na Play Store</a>`); G() && G().refresh();
    return;
  }
  if (LS.get("hrc.reloadedFor") === build) return;   // já recarregou para essa versão; não entra em loop
  updPending = build; tryReload();
}
function tryReload() {
  if (!updPending) return;
  const st = G() && G().st;
  if (st === "race" || st === "raceover" || st === "lobby" || st === "onlinehost" || st === "onlinejoin" || (view && !root.classList.contains("hrc-hidden"))) { setTimeout(tryReload, 5000); return; }
  LS.set("hrc.reloadedFor", updPending);
  try { G() && G().save(); } catch (e) {}
  try { G() && G().toast("🔄 Atualizando o jogo para a versão nova…", "#4cc9f0"); } catch (e) {}
  setTimeout(() => location.reload(), 1500);
}
setTimeout(checkUpdate, 15000);
setInterval(checkUpdate, 3 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
window.HRC.checkUpdate = checkUpdate;

const ui = document.getElementById("ui");
if (ui) new MutationObserver(() => decorateHub()).observe(ui, { childList: true });
decorateHub();
boot();

</script>
</body>
</html>
