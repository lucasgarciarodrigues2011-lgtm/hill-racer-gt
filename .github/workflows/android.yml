name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "app/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: SDK do Android (já vem na máquina do GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependências
        working-directory: app
        run: npm install

      - name: Gerar projeto Android
        working-directory: app
        run: |
          npx cap add android
          mkdir -p assets
          cp ../icon-512.png assets/icon-only.png
          cp ../icon-512-maskable.png assets/icon-foreground.png
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          convert -size 1024x1024 xc:'#0d1117' assets/icon-background.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#0d1117' --splashBackgroundColor '#0d1117' --splashBackgroundColorDark '#0d1117' || echo "aviso: ícones padrão mantidos"
          npm run android

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "Sem chave de assinatura: só o APK de teste será gerado."
          fi

      - name: Compilar
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          if [ -n "$KEYSTORE_FILE" ]; then ./gradlew bundleRelease --no-daemon; fi

      - name: APK de teste (instalar direto no celular)
        uses: actions/upload-artifact@v4
        with:
          name: hill-racer-gt-teste-apk
          path: app/android/app/build/outputs/apk/debug/*.apk

      - name: AAB para a Play Store
        if: env.KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: hill-racer-gt-playstore-aab
          path: app/android/app/build/outputs/bundle/release/*.aab
